# Saves the Los Angeles schedule for the coming two weeks.
# Runs at 08:23 UTC: 1:23am Pacific in summer, 12:23am in winter. One run a day.
# (Set in UTC on purpose: with a `timezone:` line the runs started about seven hours
# late, 7-9am Pacific, Oct 5-9. The odd minute avoids the busy top of the hour.)
# Free on this public repo: no new accounts or keys.
# The job commits straight to main so the night is saved without waiting on a
# review. If main rejects the push, it opens a pull request instead.
# A forecast list the app uses will build the site. A listing-only commit does not.

name: Nightly schedule archive

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: schedule-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Save today's schedule
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npm run archive-schedule

      # Expected draws from the night's results: this season's level and the opponent
      # ratios move as games are played (docs/expected-draw-decisions-oct7.md).
      - name: Recompute expected draws
        # A hiccup here must not lose the night's snapshot: the commit step still runs.
        continue-on-error: true
        run: node scripts/attendance-calibrate.mjs

      # The catalog as shared truth (docs/archive/proposals/catalog-proposal-oct6.md). Skips itself when the secrets are missing.
      - name: Write the catalog to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/catalog-write.mjs

      - name: Commit and push the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule-archive data/weather data/results src/data/scheduleArchiveIndex.ts src/data/startForecastIndex.ts src/data/weatherIndex.ts src/data/resultsIndex.ts src/data/expectedDrawIndex.ts
          if git diff --cached --quiet; then
            echo "No schedule change to commit."
            exit 0
          fi
          day=$(git diff --cached --name-only | sed -n 's|.*/\([0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]\)\.json|\1|p' | head -n 1)
          git commit -m "Save the schedule for ${day:-the coming days}"
          # main may have moved while the job ran; rebase the one data commit onto it and try again.
          # (The old fallback opened a pull request, which this repo's settings do not allow Actions to do.)
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Saved on main."
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep 5
          done
          echo "Could not push the snapshot after three tries."
          exit 1
